name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR/branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - name: tsc --noEmit
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      # Unit suites only: jest.config.js excludes *.int.test.ts, which need Postgres or Redis.
      - name: Jest
        run: npm test

  integration:
    name: Integration tests (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # One service's failure should not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            database: auth_test_db
          - service: catalog-service
            database: catalog_test_db
    services:
      postgres:
        # Keep in sync with the postgres image in docker-compose.yml.
        image: postgres:16
        env:
          POSTGRES_USER: cinescope
          POSTGRES_PASSWORD: cinescope_secret
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinescope -d ${{ matrix.database }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      # test:int targets the compose hostname `postgres` on purpose, so it can
      # never reach a development database. Here the service container is
      # published on the runner's localhost, so give it that name.
      - name: Alias the postgres hostname
        run: echo '127.0.0.1 postgres' | sudo tee -a /etc/hosts
      # Applies the migrations to the test database, then runs *.int.test.ts serially.
      - name: Jest (integration)
        run: npm run test:int -w ${{ matrix.service }}

  # Separate from the Postgres matrix above: a different service container,
  # and that matrix stays unchanged.
  integration-gateway:
    name: Integration tests (gateway-service)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        # Keep in sync with the redis image in docker-compose.yml.
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      # test:int targets the compose hostname `redis` on purpose, so it can never
      # reach a development Redis. Here the service container is published on
      # the runner's localhost, so give it that name.
      - name: Alias the redis hostname
        run: echo '127.0.0.1 redis' | sudo tee -a /etc/hosts
      # Runs *.int.test.ts serially against logical database 15.
      - name: Jest (integration)
        run: npm run test:int -w gateway-service

  # The development stack itself, not service containers: the suite needs the
  # real gateway, auth-service and catalog-service, migrated and seeded as
  # `deps` leaves them. No setup-workspace: everything installs and runs inside
  # the dev image, so native modules (bcrypt) are built for Alpine, not the runner.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # The dev containers run as ${UID}:${GID} (default 1000:1000) and write
      # node_modules, dist/ and the Prisma clients into this checkout, which
      # belongs to the runner user, whose UID is not 1000. Compose reads the
      # root .env; UID cannot be exported from bash, where it is readonly.
      - name: Run the containers as the runner user
        run: printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" > .env

      # Each service reads its secrets from apps/<service>/.env (gitignored);
      # Compose supplies the rest. One random access secret, shared by the
      # signer (auth-service) and both verifiers (catalog-service, gateway).
      - name: Write the service secrets
        run: |
          access_secret="$(openssl rand -hex 32)"
          printf 'JWT_ACCESS_SECRET=%s\nJWT_REFRESH_SECRET=%s\n' "$access_secret" "$(openssl rand -hex 32)" > apps/auth-service/.env
          printf 'JWT_ACCESS_SECRET=%s\n' "$access_secret" > apps/catalog-service/.env
          printf 'JWT_ACCESS_SECRET=%s\n' "$access_secret" > apps/gateway-service/.env

      # Returns once every container has started, which the services' dependency
      # on `deps` completing holds back until the workspace is installed and
      # auth-service is migrated and seeded. Fails here if `deps` fails.
      - name: Start the stack
        run: docker compose up -d

      # On the Compose network, as in development. The suite's global setup
      # waits for /health on the gateway and on every service through it.
      - name: Run the end-to-end suite
        run: >-
          docker compose run --rm --no-deps
          -e E2E_BASE_URL=http://gateway-service:4000
          deps npm run test:e2e -w e2e

      - name: Container logs
        if: failure()
        run: |
          for service in $(docker compose config --services); do
            echo "::group::$service"
            docker compose logs --no-color --timestamps "$service"
            echo "::endgroup::"
          done

      - name: Tear down the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
